name: Swiss build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: Build Swiss
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends -t bookworm-backports 7zip gcc gcc-mingw-w64-i686 libc6-dev libc6-i386 xorriso

    - name: Checkout Swiss
      uses: actions/checkout@main
      with:
        path: swiss
        fetch-depth: 0
        submodules: true

    - name: Build Swiss artifacts
      run: make
      working-directory: swiss

    - name: Upload Swiss artifacts
      uses: actions/upload-artifact@main
      with:
        name: swiss-gc
        path: swiss/swiss_r*/*

    - name: Upload release archives
      uses: actions/upload-artifact@main
      with:
        name: swiss-gc-archives
        path: |
          swiss/swiss_r*.7z
          swiss/swiss_r*.tar.xz

  # Publishes the built archives to GitHub Releases in this fork.
  # - push of a "v*" tag        -> a versioned release
  # - push to the default branch -> a rolling "continuous" prerelease
  # - manual "Run workflow"      -> a rolling "continuous" prerelease
  # Pull requests only build; they never publish.
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
    - name: Download release archives
      uses: actions/download-artifact@main
      with:
        name: swiss-gc-archives
        path: archives

    - name: Publish tagged release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --title "Swiss ${GITHUB_REF_NAME}" \
          --notes "Automated build of Swiss ${GITHUB_REF_NAME}." \
          archives/*

    - name: Publish continuous prerelease
      if: >-
        startsWith(github.ref, 'refs/tags/v') == false &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
         || github.event_name == 'workflow_dispatch')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Refresh a single rolling "continuous" prerelease at the current commit.
        gh release delete continuous --cleanup-tag --yes || true
        sleep 5
        gh release create continuous \
          --title "Continuous build" \
          --notes "Rolling build from ${GITHUB_SHA}. Updated on every push to the default branch (and manual runs)." \
          --prerelease \
          --target "${GITHUB_SHA}" \
          archives/*
